# /etc/tmpfiles.d/idea-usage.conf (idea#411): run-dir flags and usage store.
# /run/idea is tmpfs so backup/update/move skip flags vanish at reboot.
# /var/lib/idea/usage is created at install as well (installRootHelpers); this
# entry re-creates it after a wiped data partition.
d /run/idea 0755 pi pi -
d /var/lib/idea 0755 pi pi -
d /var/lib/idea/usage 0750 pi pi -
