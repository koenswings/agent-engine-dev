# /etc/tmpfiles.d/idea-usb.conf (idea#193): mount root for teacher USB sticks.
# Owned by pi so the Engine makes and removes the mount point folders and writes
# .idea-usb.json without sudo; the read-only mounts themselves go through the typed
# sudoers lines in 11-engine-files. /run is tmpfs: stale folders vanish at reboot.
d /run/idea-usb 0755 pi pi -
