# /etc/ssh/sshd_config.d/10-idea-login.conf — installed by the Engine image build (idea#453)
#
# Key-only SSH: operators log in with a key from /etc/ssh/idea_operator_keys/<user>
# (or ~/.ssh/authorized_keys); peer Engine keys stay forced-command only. Debian reads
# sshd_config.d before the rest of sshd_config and the first value wins, so this file
# (sorted before 10-idea-peer.conf and any 50-cloud-init.conf) decides. verify
# (ssh-no-password) fails the build if another file would set these first.
PasswordAuthentication no
KbdInteractiveAuthentication no
