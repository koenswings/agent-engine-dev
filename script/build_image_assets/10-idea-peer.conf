# /etc/ssh/sshd_config.d/10-idea-peer.conf — installed by build-engine (installPeerAccess)
#
# Per-Pi Engine keys (design-per-pi-engine-key.md): besides the usual per-user
# files, sshd also reads /etc/ssh/idea_authorized_keys/<user>. That file is
# root-owned and written only by `idea-app-data sync-peers`; every line in it is
# restricted to the forced command /usr/local/sbin/idea-peer-gate, so a peer
# Engine key gets no shell.
#
# Operator keys (idea#453): the fleet operator list is baked into the Engine image
# as /etc/ssh/idea_operator_keys/<user> (root:root 0644, plain keys with a shell);
# per-Pi operator keys can still go in ~/.ssh/authorized_keys. A missing file is
# ignored by sshd, so Engines installed without the image are unchanged.
# Debian reads sshd_config.d first and the first value wins, hence the low number.
AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2 /etc/ssh/idea_authorized_keys/%u /etc/ssh/idea_operator_keys/%u
