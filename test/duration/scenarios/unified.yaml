# Canonical Markov graph — ONE scenario file (proposals/duration-tests.md).
# Run modes (CI / live / stress) are CLI knobs only — not alternate YAMLs.
# Alternate names (minimal, stress, school-day, …) resolve to this file as deprecated aliases.
# Deterministic walks live under test/duration/walks/ (kind: walk) and reference this graph.
name: Unified school day
duration_minutes: 480
seed: 42
exclude_engines: [idea02]
pool_engines: [idea01, idea03, idea04]
store_mode: shared
fixtures:
  kolibri:
    path: tests/duration-tests/fixtures/kolibri
    diskId: duration-kolibri-grade5a-001
    instanceId: kolibri-grade5a-001
    infra_disk: true
  nextcloud:
    path: tests/duration-tests/fixtures/nextcloud
    diskId: duration-nextcloud-grade5a-001
    instanceId: nextcloud-grade5a-001
    infra_disk: true
  # kiwix: deferred (Kid pack when wiki_browse goes live)

states:
  start:
    description: Neutral hub — sample layer entry
    transitions:
      - to: console_teacher
        weight: 25
        action: open_console_as_teacher
      - to: console_learner
        weight: 35
        action: open_console_as_learner
      - to: op_entry
        weight: 25
        action: open_console_as_operator
      - to: infra_idle
        weight: 15
        action: enter_infra_fleet_walk

  # ── Usage (11) ──────────────────────────────────────────────────────────
  console_teacher:
