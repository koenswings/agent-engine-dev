    transitions:
      - to: kolibri_manage
        weight: 12
        action: create_class
      - to: kolibri_manage
        weight: 12
        action: enroll_learners
      - to: kolibri_manage
        weight: 14
        action: build_lesson
      - to: kolibri_manage
        weight: 9
        action: create_quiz
      - to: kolibri_manage
        weight: 8
        action: read_reports
      - to: kolibri_home
        weight: 20
        action: preview_as_learner
      - to: console_teacher
        weight: 25
        action: back_to_console
      - to: start
        weight: 5
        action: return_to_start

  kolibri_home:
    layer: usage
    transitions:
      - to: kolibri_watching
        weight: 45
        action: open_video
      - to: kolibri_exercise
        weight: 25
        action: open_exercise
      - to: kolibri_home
        weight: 20
        action: browse_classes
      - to: console_learner
        weight: 10
        action: leave_kolibri
      - to: start
        weight: 5
        action: return_to_start

  kolibri_watching:
