        action: next_resource
      - to: kolibri_home
        weight: 15
        action: exit_lesson
      - to: start
        weight: 5
        action: return_to_start

  kolibri_exercise:
    layer: usage
    transitions:
      - to: kolibri_home
        weight: 70
        action: finish_exercise
      - to: kolibri_watching
        weight: 30
