  # ── Infra (4) ───────────────────────────────────────────────────────────
  infra_idle:
    layer: infra
    transitions:
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 5
        action: infra_reboot_engine
      - to: infra_idle
        weight: 50
        action: infra_undock_fixtures
      - to: start
        weight: 5
        action: return_to_start

  infra_docked:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 20
        action: infra_undock_fixtures
      - to: infra_disk_moved
        weight: 10
        action: infra_move_disk
      - to: infra_docked
        weight: 60
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 5
        action: infra_reboot_engine
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool

  infra_disk_moved:
    layer: infra
    transitions:
      - to: infra_docked
        weight: 50
        action: infra_dock_fixture
      - to: infra_idle
        weight: 25
        action: infra_undock_fixtures
      - to: infra_reboot
        weight: 20
        action: infra_reboot_engine
      - to: start
        weight: 5
        action: return_to_start

  infra_reboot:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 55
        action: infra_undock_fixtures
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: start
        weight: 5
        action: return_to_start

initial_state: start
