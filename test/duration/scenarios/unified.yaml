        weight: 5
        action: return_to_start

  op_overview:
    layer: operator
    transitions:
      - to: op_disk
        weight: 28
        action: open_disk_inventory
      - to: op_instance
        weight: 18
        action: open_instance_controls
      - to: op_eject
        weight: 10
        action: eject_disk
      - to: op_account
        weight: 6
        action: open_account
      - to: op_settings
        weight: 6
        action: open_settings
      - to: op_overview
        weight: 20
        action: stay_on_overview
      - to: op_overview
        weight: 12
        action: notice_usb_dock
      - to: start
        weight: 5
        action: return_to_start

  op_disk:
    layer: operator
    transitions:
      - to: op_install
        weight: 18
        action: install_app
      - to: op_files
        weight: 8
        action: make_files_disk
      - to: op_files
        weight: 6
        action: add_files_role
      - to: op_backup
        weight: 8
        action: make_backup_disk
      - to: op_backup
        weight: 6
        action: restore_from_backup
      - to: op_instance
        weight: 18
        action: open_instance_controls
      - to: op_copy_move
        weight: 5
