    transitions:
      - to: kolibri_home
        weight: 40
        action: open_kolibri_as_learner
      - to: nc_browse
        weight: 25
        action: open_nextcloud_as_learner
      - to: wiki_browse
        weight: 20
        action: open_wikipedia_as_learner
      - to: console_learner
        weight: 15
        action: stay_on_learner_overview
