    transitions:
      - to: kolibri_manage
        weight: 20
        action: open_kolibri_as_teacher
      - to: nc_browse
        weight: 20
        action: open_nextcloud_as_teacher
      - to: wiki_browse
        weight: 10
        action: open_wikipedia_as_teacher
      - to: console_teacher
        weight: 50
        action: stay_on_teacher_overview
      - to: start
        weight: 5
        action: return_to_start

  console_learner:
