# Minimal live dock smoke — Kid testMode dock (copy + sentinel) + ejectDisk.
# Does NOT start Kolibri/Nextcloud instances (RealFleetOps excludes instances/ on copy).
# Kolibri image not required for this scenario.
# Roots: IDEA_DISKS_ROOT=/home/pi/idea/duration-disks, IDEA_WATCH_DIR=/home/pi/idea/duration-watch
# NEVER /disks, NEVER idea03 sdb1, NEVER golden idea02.
# Prefer: pnpm test:duration -- --live --scenario minimal-dock --fast --hosts …
name: Minimal live dock smoke
duration_minutes: 20
seed: 11
exclude_engines: [idea02]
pool_engines: [idea01, idea03]
store_mode: unique
fixtures:
  kolibri:
    path: tests/duration-tests/fixtures/kolibri
    diskId: duration-kolibri-grade5a-001
    instanceId: kolibri-grade5a-001
    infra_disk: true
  nextcloud:
    path: tests/duration-tests/fixtures/nextcloud
    diskId: duration-nextcloud-grade5a-001
    instanceId: nextcloud-grade5a-001
    infra_disk: true

states:
  start:
    description: Neutral hub — enter infra dock walk
    transitions:
      - to: infra_idle
        weight: 85
        action: enter_infra_fleet_walk
      - to: console_learner
        weight: 15
        action: open_console_as_learner

  console_learner:
    layer: usage
    transitions:
      - to: start
        weight: 1
        action: return_to_start

  infra_idle:
    layer: infra
    description: Pool up; fixtures undocked — dock Kolibri primary
    transitions:
      - to: infra_docked
        weight: 55
        action: infra_dock_fixture
      - to: infra_idle
        weight: 25
        action: infra_undock_fixtures
      - to: infra_reboot
        weight: 10
        action: infra_reboot_engine
      - to: start
        weight: 10
        action: return_to_start
    invariants:
      - type: golden_untouched

  infra_docked:
    layer: infra
    description: Fixture docked via Kid copy+sentinel (no instance start)
    transitions:
      - to: infra_idle
        weight: 40
        action: infra_undock_fixtures
      - to: infra_disk_moved
        weight: 25
        action: infra_move_disk
      - to: infra_docked
        weight: 20
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 5
        action: infra_reboot_engine
      - to: start
        weight: 10
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool
      - type: golden_untouched

  infra_disk_moved:
    layer: infra
    description: Optional one move across pool engines
    transitions:
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: infra_idle
        weight: 40
        action: infra_undock_fixtures
      - to: start
        weight: 20
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool
      - type: golden_untouched

  infra_reboot:
    layer: infra
    description: pm2 restart (--fast) with bumped reconnect timeout
    transitions:
      - to: infra_idle
        weight: 50
        action: infra_undock_fixtures
      - to: infra_docked
        weight: 35
        action: infra_dock_fixture
      - to: start
        weight: 15
        action: return_to_start
    invariants:
      - type: golden_untouched

initial_state: start
