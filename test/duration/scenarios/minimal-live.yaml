# Dock-free overnight smoke against real Pis (unique stores, mdns off).
# No infra_dock_fixture / infra_move_disk — Kid USB fixtures are not on the fleet.
# Prefer: pnpm test:duration -- --live --scenario minimal-live --fast --hosts …
name: Minimal live reboot smoke
duration_minutes: 15
seed: 7
exclude_engines: [idea02]
pool_engines: [idea01, idea03]
store_mode: unique
# Listed for documentation / future dock; infra_disk:false so walker won't undock/dock them.
fixtures:
  kolibri:
    path: tests/duration-tests/fixtures/kolibri
    diskId: duration-kolibri-grade5a-001
    instanceId: kolibri-grade5a-001
    infra_disk: false
  nextcloud:
    path: tests/duration-tests/fixtures/nextcloud
    diskId: duration-nextcloud-grade5a-001
    instanceId: nextcloud-grade5a-001
    infra_disk: false

states:
  start:
    description: Neutral hub — sample infra or light UI stubs
    transitions:
      - to: infra_idle
        weight: 70
        action: enter_infra_fleet_walk
      - to: console_learner
        weight: 30
        action: open_console_as_learner

  console_learner:
    layer: usage
    transitions:
      - to: start
        weight: 1
        action: return_to_start

  infra_idle:
    layer: infra
    description: Pool engines up; no fixture dock (dock-free smoke)
    transitions:
      - to: infra_reboot
        weight: 40
        action: infra_reboot_engine
      - to: infra_idle
        weight: 45
        action: infra_undock_fixtures
      - to: start
        weight: 15
        action: return_to_start
    invariants:
      - type: golden_untouched

  infra_reboot:
    layer: infra
    description: One non-golden pool engine pm2 restarts (--fast) or reboots
    transitions:
      - to: infra_idle
        weight: 70
        action: infra_undock_fixtures
      - to: start
        weight: 30
        action: return_to_start
    invariants:
      - type: golden_untouched

initial_state: start
