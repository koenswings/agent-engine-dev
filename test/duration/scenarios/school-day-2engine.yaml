# 2-engine school-day UI walk for idea01+idea03 claims (--live --ui).
# Does NOT require pool engine idea04. Does NOT use deferred Intents
# (keep_watching / next_resource / exit_lesson / open_wikipedia_*).
# store_mode unique matches live fleet (shared+mDNS not provisioned).
# Prefer: pnpm test:duration -- --live --ui --scenario school-day-2engine --fast \
#   --hosts idea01=…,idea03=… --console-url http://idea01:8080
name: School day 2-engine UI
duration_minutes: 120
seed: 21
exclude_engines: [idea02]
pool_engines: [idea01, idea03]
store_mode: unique
fixtures:
  kolibri:
    path: tests/duration-tests/fixtures/kolibri   # agent-app-dev (PR #10)
    diskId: duration-kolibri-grade5a-001
    instanceId: kolibri-grade5a-001
    infra_disk: true
  nextcloud:
    path: tests/duration-tests/fixtures/nextcloud
    diskId: duration-nextcloud-grade5a-001
    instanceId: nextcloud-grade5a-001
    infra_disk: true
  # kiwix: deferred (open_wikipedia_* not Pixel-hardpass)

states:
  start:
    description: Neutral hub — usage / operator / light infra (no idea04)
    transitions:
      - to: console_teacher
        weight: 25
        action: open_console_as_teacher
      - to: console_learner
        weight: 40
        action: open_console_as_learner
      - to: op_entry
        weight: 25
        action: open_console_as_operator
      - to: infra_idle
        weight: 10
        action: enter_infra_fleet_walk

  console_teacher:
    layer: usage
    transitions:
      - to: kolibri_manage
        weight: 40
        action: open_kolibri_as_teacher
      - to: console_teacher
        weight: 55
        action: stay_on_teacher_overview
      - to: start
        weight: 5
        action: return_to_start

  console_learner:
    layer: usage
    transitions:
      - to: kolibri_home
        weight: 40
        action: open_kolibri_as_learner
      - to: nc_browse
        weight: 25
        action: open_nextcloud_as_learner
      - to: console_learner
        weight: 30
        action: stay_on_learner_overview
      - to: start
        weight: 5
        action: return_to_start

  kolibri_manage:
    layer: usage
    transitions:
      - to: console_teacher
        weight: 50
        action: stay_on_teacher_overview
      - to: kolibri_manage
        weight: 45
        action: open_kolibri_as_teacher
      - to: start
        weight: 5
        action: return_to_start

  kolibri_home:
    layer: usage
    description: Learner Kolibri — open_video / open_exercise with Kid pins (no deferred chrome)
    transitions:
      - to: kolibri_watching
        weight: 40
        action: open_video
      - to: kolibri_exercise
        weight: 25
        action: open_exercise
      - to: console_learner
        weight: 30
        action: stay_on_learner_overview
      - to: start
        weight: 5
        action: return_to_start

  kolibri_watching:
    layer: usage
    description: After open_video — leave via hardpass Intents only (no keep_watching / exit_lesson)
    transitions:
      - to: kolibri_home
        weight: 50
        action: open_kolibri_as_learner
      - to: console_learner
        weight: 45
        action: stay_on_learner_overview
      - to: start
        weight: 5
        action: return_to_start

  kolibri_exercise:
    layer: usage
    description: After open_exercise — leave via hardpass Intents only
    transitions:
      - to: kolibri_home
        weight: 50
        action: open_kolibri_as_learner
      - to: console_learner
        weight: 45
        action: stay_on_learner_overview
      - to: start
        weight: 5
        action: return_to_start

  nc_browse:
    layer: usage
    transitions:
      - to: console_learner
        weight: 95
        action: stay_on_learner_overview
      - to: start
        weight: 5
        action: return_to_start

  op_entry:
    layer: operator
    transitions:
      - to: op_overview
        weight: 95
        action: stay_on_overview
      - to: start
        weight: 5
        action: return_to_start

  op_overview:
    layer: operator
    transitions:
      - to: op_disk
        weight: 28
        action: open_disk_inventory
      - to: op_overview
        weight: 67
        action: stay_on_overview
      - to: start
        weight: 5
        action: return_to_start

  op_disk:
    layer: operator
    transitions:
      - to: op_overview
        weight: 95
        action: stay_on_overview
      - to: start
        weight: 5
        action: return_to_start

  infra_idle:
    layer: infra
    description: Light infra on 2-pool only (idea01+idea03); no idea04
    transitions:
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 5
        action: infra_reboot_engine
      - to: infra_idle
        weight: 50
        action: infra_undock_fixtures
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: golden_untouched

  infra_docked:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 25
        action: infra_undock_fixtures
      - to: infra_disk_moved
        weight: 15
        action: infra_move_disk
      - to: infra_docked
        weight: 50
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 5
        action: infra_reboot_engine
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool
      - type: golden_untouched

  infra_disk_moved:
    layer: infra
    transitions:
      - to: infra_docked
        weight: 50
        action: infra_dock_fixture
      - to: infra_idle
        weight: 30
        action: infra_undock_fixtures
      - to: infra_reboot
        weight: 15
        action: infra_reboot_engine
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool
      - type: golden_untouched

  infra_reboot:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 55
        action: infra_undock_fixtures
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: golden_untouched

initial_state: start
