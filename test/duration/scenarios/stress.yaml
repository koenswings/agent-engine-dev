# High-churn infra (pool only). Optional overnight stress.
name: Infra stress
duration_minutes: 120
seed: 99
exclude_engines: [idea02]
pool_engines: [idea01, idea03, idea04]
store_mode: shared
fixtures:
  kolibri:
    path: tests/duration-tests/fixtures/kolibri   # agent-app-dev (PR #10)
    diskId: duration-kolibri-grade5a-001
    instanceId: kolibri-grade5a-001
    infra_disk: true
  nextcloud:
    path: tests/duration-tests/fixtures/nextcloud
    diskId: duration-nextcloud-grade5a-001
    instanceId: nextcloud-grade5a-001
    infra_disk: true
  # kiwix: deferred (Phase 3 / optional)

states:
  start:
    transitions:
      - to: infra_idle
        weight: 1
        action: enter_infra_fleet_walk

  infra_idle:
    layer: infra
    transitions:
      - to: infra_docked
        weight: 50
        action: infra_dock_fixture
      - to: infra_reboot
        weight: 20
        action: infra_reboot_engine
      - to: infra_idle
        weight: 25
        action: infra_undock_fixtures
      - to: start
        weight: 5
        action: return_to_start

  infra_docked:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 25
        action: infra_undock_fixtures
      - to: infra_disk_moved
        weight: 30
        action: infra_move_disk
      - to: infra_reboot
        weight: 20
        action: infra_reboot_engine
      - to: infra_docked
        weight: 20
        action: infra_dock_fixture
      - to: start
        weight: 5
        action: return_to_start
    invariants:
      - type: disk_docked
        disk: duration-kolibri-grade5a-001
        engine: any_pool

  infra_disk_moved:
    layer: infra
    transitions:
      - to: infra_docked
        weight: 40
        action: infra_dock_fixture
      - to: infra_idle
        weight: 20
        action: infra_undock_fixtures
      - to: infra_reboot
        weight: 35
        action: infra_reboot_engine
      - to: start
        weight: 5
        action: return_to_start

  infra_reboot:
    layer: infra
    transitions:
      - to: infra_idle
        weight: 40
        action: infra_undock_fixtures
      - to: infra_docked
        weight: 55
        action: infra_dock_fixture
      - to: start
        weight: 5
        action: return_to_start

initial_state: start
