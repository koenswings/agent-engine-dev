  - from: op_entry
    to: op_overview
    action: sign_in
  - from: op_overview
    to: op_disk
    action: open_disk_inventory
  - from: op_disk
    to: op_install
    action: install_app
  - from: op_install
    to: op_overview
    action: back_to_overview
  - from: op_overview
    to: op_disk
    action: open_disk_inventory
  - from: op_disk
    to: op_files
    action: make_files_disk
  - from: op_files
    to: op_disk
    action: files_role_added
  - from: op_disk
    to: op_files
    action: add_files_role
  - from: op_files
    to: op_disk
    action: files_role_added
  - from: op_disk
    to: op_backup
    action: make_backup_disk
  - from: op_backup
    to: op_disk
    action: backup_configured_restored
  # Select Backup Disk before restore (not Grade5A). Graph: open_disk_inventory
  # only from op_overview — back_to_overview then re-open with
  # DURATION_BACKUP_DISK_ID=duration-empty-001 (post make_backup_disk role).
  - from: op_disk
    to: op_overview
    action: back_to_overview
  - from: op_overview
    to: op_disk
    action: open_disk_inventory
  - from: op_disk
    to: op_backup
    action: restore_from_backup
  - from: op_backup
    to: op_disk
    action: backup_configured_restored
  # Prefer A — restore Confirm may SIGTERM source instance; start before move_app
  # so the docker-missing stability probe does not abort.
  - from: op_disk
    to: op_instance
    action: open_instance_controls
  - from: op_instance
    to: op_instance
    action: start_instance
  - from: op_instance
    to: op_disk
    action: back_to_disk
  - from: op_disk
    to: op_copy_move
    action: move_app
  - from: op_copy_move
    to: op_disk
    action: stay_on_source_disk
  # Prefer A r17: select still-empty pack before erase (not Grade5A / not Backup).
  # After make_backup, empty-001 is backup — Pixel @48a4a05 ensureEmptyDiskPanel
  # discovers docked duration-empty-002 (empty-badge). Env keeps EMPTY=001 /
  # BACKUP=001. Mirror Backup Disk select: back_to_overview → open_disk_inventory.
  # Never erase Grade5A app disks.
  # After confirm_erase: Engine redockEmpty002AfterErase fresh-docks empty-002
  # (Pixel discover; EMPTY stays 001). Path A erase should still republish Empty.
  # r24/r26: erase left empty-002 absent → FAIL@85 late install_app.
  - from: op_disk
    to: op_overview
    action: back_to_overview
  - from: op_overview
    to: op_disk
    action: open_disk_inventory
  - from: op_disk
    to: op_erase
    action: erase_disk
  - from: op_erase
    to: op_disk
    action: confirm_erase
  # Post-erase eject: DURATION_EJECT_DISK_ID=duration-nextcloud-grade5a-001
  # (Pixel also discovers a surviving ejectable disk).
  - from: op_disk
    to: op_eject
    action: eject_disk
  - from: op_eject
    to: op_overview
    action: cancel_eject
  - from: op_overview
    to: op_instance
    action: open_instance_controls
  # Prefer A — Back up while Running; stop first leaves backup disabled/locked.
  - from: op_instance
    to: op_instance
    action: start_instance
  - from: op_instance
    to: op_instance
    action: open_app
  - from: op_instance
    to: op_instance
    action: backup_instance
  - from: op_instance
    to: op_instance
    action: stop_instance
  - from: op_instance
    to: op_disk
    action: back_to_disk
  # Prefer A r27 FAIL@86: start_after_install must target NEW empty-002 install uuid
  # (Pixel discover non-grade5a @2c55756), not kolibri-grade5a-001. install_app waits settle.
  # Prefer A r31: late install must not use stale --source empty-001 (backup, no apps/);
  # Prefer A r32: Engine waitEmpty002PostInstallRunning before start_after_install (auto-start race).
  # Engine installApp falls back to GitHub / docked bundle when --source apps missing.
  - from: op_disk
    to: op_install
    action: install_app
  - from: op_install
    to: op_instance
    action: start_after_install
  # Prefer A r34: after move_app, grade5a is on nextcloud; Pixel copy_app must target a different disk (data-source-disk-id != target).
  # Same-disk nextcloud is rejected by NetworkTree, so the modal never opens (FAIL@87).
  - from: op_instance
    to: op_copy_move
    action: copy_app
  - from: op_copy_move
    to: op_instance
    action: open_copied_instance
  - from: op_instance
    to: op_disk
    action: back_to_disk
  # Prefer A r35 FAIL@90: after open_copied, Engine redockEmpty002BeforeSecondInstall
  # fresh-docks empty-002 Empty (start_after_install left it as kolibri app disk;
  # empty-001 is backup). Second late install_app + later erase need EmptyDiskPanel.
  - from: op_disk
    to: op_install
    action: install_app
  - from: op_install
    to: op_disk
    action: stay_on_disk
  - from: op_disk
    to: op_erase
    action: erase_disk
  - from: op_erase
    to: op_overview
    action: cancel_erase
  - from: op_overview
    to: op_account
    action: open_account
  - from: op_account
    to: op_entry
    action: log_out
  - from: op_entry
    to: op_overview
    action: sign_in
  - from: op_overview
    to: op_settings
    action: open_settings
  - from: op_settings
    to: op_settings
    action: switch_engine
  - from: op_settings
    to: op_settings
    action: reboot_engine
