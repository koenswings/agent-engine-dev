# Deterministic cover-registered-intents walk ("registered-intents walk") — NOT a Markov graph.
# Loads states/invariants/fixtures/pool from scenarios/unified.yaml.
# Covers the current Pixel-registered demo subset (58 actions; registry 65 @ Console#134 cdcfdb1)
# plus Engine infra FleetOps (dock/undock/move/reboot via RealFleetOps).
# Excludes every action in DEFERRED_UI_INTENTS + PIXEL_MISSING_INTENTS
# (coaching Intents are registered but not yet expanded here; keep_watching, wikipedia, etc.).
# Prefer short layer cycles; re-enter via return_to_start / hubs.
# Live --ui: early infra enter + infra_dock_fixture BEFORE first open_disk_inventory;
# reboot/move cycle runs later from infra_idle (avoids startInstances zombie on pm2 restart).
# Path A `--start-instances` preserves dock across return_to_start.
# cover-all = strict full graph (failLoud on Pixel-missing under --ui).
#
# Pixel Prefer A (Console#134 @48a4a05+): copy_app/move_app multi-disk +
# EmptyDiskPanel + erase empty-only. Live preload: demoMode=false; four Path A
# disks docked (kolibri + nextcloud + duration-empty-001 + duration-empty-002 on
# idea-test-1/2/3/4). Env: DURATION_EMPTY_DISK_ID=duration-empty-001 (make_backup),
# DURATION_BACKUP_DISK_ID=duration-empty-001, empty-002 docked for erase discover,
# DURATION_EJECT_DISK_ID=duration-nextcloud-grade5a-001. Prefer A r17: after
# make_backup empty-001 is backup — Pixel ensureEmptyDiskPanel discovers empty-002
# (loud-fail if none). Walk: back_to_overview → open_disk_inventory before erase.
# Never erase Grade5A. Engine infra_dock_fixture siblings include empty-002.
# Late install_app after erase: empty-002 must stay docked Empty (Pixel empty-badge
# discover; no DURATION_EMPTY_DISK_ID_2). r24/r26 FAIL@85: erase undocked empty-002.
# Engine tip: after confirm_erase, redockEmpty002AfterErase fresh-docks empty-002
# (EMPTY stays 001). Path A should still prefer erase republish Empty.
# Prefer A r35 FAIL@90: start_after_install fills empty-002 with kolibri → second
# late install_app / later erase need EmptyDiskPanel again. Engine tip: after
# open_copied_instance, redockEmpty002BeforeSecondInstall fresh-docks empty-002.
# Optional DURATION_COPY_SOURCE_DISK / DURATION_COPY_TARGET_DISK /
# DURATION_COPY_INSTANCE_ID (default kolibri→nextcloud).
# Wait for Atlas :8080 GO + Path A re-dock layout (kolibri/:18080, empties) before
# live --ui --record-walk.
